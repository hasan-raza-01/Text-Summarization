[project]
name = "text-summarization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "dvc>=3.67.1",
    "evaluate>=0.4.6",
    "fastapi>=0.141.1",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "protobuf>=7.36.1",
    "python-box>=7.4.1",
    "python-dotenv>=1.2.3",
    "rouge>=1.0.1",
    "rouge-score>=0.1.2",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers<5.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
text-summarization = "text_summarization:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
